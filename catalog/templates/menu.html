{% load static %}
{% load active_tags %}
<div class="col-2 d-flex flex-column bg-dark text-white p-3"
     style="position: fixed; top: 0; min-height: 100vh; overflow-y: auto;">
    <div>
        <div class="d-flex align-items-center mb-2">
            <a href="{% url 'catalog:home' %}">
                <img src="{% static '/images/image_navbar.png' %}" alt="Logo"
                     style="height: 40px; margin-right: 8px;">
            </a>
            <span class="fs-2">Меню</span>
        </div>
        <hr class="my-3">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="{% url 'catalog:home' %}"
                   class="nav-link {% active request 'home' 'product_page' 'product_delete' 'product_update' %}">
                    Главная
                </a>
            </li>
            <li>
                <a href="#" class="nav-link {% active request 'categories' %}">
                    Категории
                </a>
            </li>
            <li>
                <a href="#" class="nav-link {% active request 'orders' %}">
                    Заказы
                </a>
            </li>
            <li>
                <a href="{% url 'catalog:contacts' %}"
                   class="nav-link {% active request 'contacts' %}">
                    Контакты
                </a>
            </li>

            <li>
                <a href="{% url 'catalog:product_create' %}" class="nav-link {% active request 'product_create' %}">
                    Добавить товар
                </a>
            </li>

        </ul>
    </div>
    <!-- Нижний блок -->
    <div class="dropdown mt-auto">
        <div class="mt-auto">
            <ul class="nav nav-pills flex-column">
                <li>
                    <a href="{% url 'blog:posts' %}"
                       class="nav-link {% active request 'posts' 'post_page' 'post_delete' 'post_update' %}">
                        Блог
                    </a>
                </li>
            </ul>
        </div>
        <hr class="my-3">
        {% if user.is_authenticated %}
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle"
           id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
            <img src="{% if user.avatar %}{{ user.avatar | media_filter }}{% else %}{% static '/images/photo.png' %}{% endif %}"
                 alt="{{ user.email }}" width="32" height="32" class="rounded-circle me-2">
            <strong>{{ user.email }}</strong>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser">
            <li>
                <a class="dropdown-item" href="{% url 'users:profile-update' user.pk %}">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Редактировать профиль
                </a>
            </li>
            <li>
                <hr class="dropdown-divider">
            </li>
            <li>
                <a href="#" class="dropdown-item"
                   onclick="document.getElementById('logout-form').submit(); return false;">
                    <i class="bi bi-box-arrow-right me-2"></i>Выйти
                </a>
                <form id="logout-form" method="post" action="{% url 'users:logout' %}" style="display: none;">
                    {% csrf_token %}
                </form>
            </li>
        </ul>
        {% else %}
        <li class="nav-item dropdown">
            <a href="#" class="nav-link d-flex align-items-center text-white text-decoration-none dropdown-toggle"
               data-bs-toggle="dropdown" aria-expanded="false">
                <img src="{% static '/images/photo.png' %}" alt="Гость" width="32" height="32"
                     class="rounded-circle me-2">
                <strong>Гость</strong>
            </a>
            <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                <li><a class="dropdown-item" href="{% url 'users:login' %}">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Войти
                </a></li>
                <li><a class="dropdown-item" href="{% url 'users:register' %}">
                    <i class="bi bi-person-plus me-2"></i>Регистрация
                </a></li>
            </ul>
        </li>
        {% endif %}
    </div>
</div>
