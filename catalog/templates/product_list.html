<div class="row justify-content-center mt-5 g-4">
    {% for product in all_products %}
    <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card text-center h-100 product-card">
            <div class="card-header">
                <h5 class="card-title mb-0">{{ product.name }}</h5>
            </div>
            <div class="card-body d-flex flex-column">
                <h2 class="card-price my-2">{{ product.price }} руб.</h2>
                <p class="card-text flex-grow-1">{{ product.description|truncatechars:100 }}</p>
                <a href="#" class="btn btn-outline-primary w-100 mt-auto hover-effect">Купить</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

<style>
.product-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.product-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.1);
}
.hover-effect {
    transition: all 0.3s ease;
}
.hover-effect:hover {
    background-color: #0d6efd;
    color: white;
    border-color: #0d6efd;
}
</style>
