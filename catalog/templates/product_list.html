<div class="row justify-content-center mt-5 gx-5">
    {% for product in latest_products %}
    <div class="col-md-4 col-lg-3 mb-4 me-5">
        <div class="card text-center">
            <div class="card-header">
                <h5>{{ product.name }}</h5>
            </div>
            <div class="card-body">
                <h2 class="card-price my-2">{{ product.price }} руб.</h2>
                <p class="card-text">{{ product.description|truncatechars:100 }}</p>
                <a href="#" class="btn btn-outline-primary w-100 hover-bg-primary">Купить</a>
                <!--<a href="#" class="btn w-100" style="
                            background: transparent;
                            border: 2px solid #0d6efd;
                            color: #0d6efd;
                            transition: all 0.3s">Купить</a>-->
            </div>
        </div>
    </div>
    {% endfor %}
</div>
