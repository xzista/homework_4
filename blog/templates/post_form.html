{% extends 'base.html' %}

{% block content %}
<div class="text-center">
    <h1 class="mb-3">{% if object %}Редактирование статьи{% else %}Создание статьи{% endif %}</h1>
</div>
<div class="row justify-content-center mt-5 g-4">
    <div class="col-md-5 col-lg-5 mb-4">
        <div class="card" style="width: 50vh;">
            <div class="card-body">
                <form class="row" method="post" action="" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary">
                            {% if object %}
                            Редактировать
                            {% else %}
                            Создать
                            {% endif %}
                        </button>
                        <a href="{% url 'blog:posts' %}" class="btn btn-secondary">Вернуться на главную</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>
{% endblock %}
